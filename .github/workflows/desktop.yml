name: Desktop Build (Linux + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# contents: write — lets the release job publish installers on v* tags
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: '--bundles nsis'
            label: windows-nsis
          - os: ubuntu-latest
            targets: '--bundles deb appimage'
            label: linux-deb-appimage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri v2 system dependencies (WebKitGTK etc.)
      # ubuntu-latest is 24.04 (noble) — libappindicator3 was replaced by the
      # ayatana variant there; installing BOTH names breaks apt with
      # "libayatana-appindicator3-1 : Conflicts: libappindicator3-1".
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev

      # Auto-update signing: when the TAURI_SIGNING_PRIVATE_KEY secret exists,
      # the build also produces .sig updater artifacts; without it the build
      # stays green and simply ships unsigned (updater dormant).
      - name: Detect updater signing key
        id: signing
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: echo "present=$(if [ -n "$KEY" ]; then echo true; else echo false; fi)" >> "$GITHUB_OUTPUT"

      # The C++ core is compiled into the Tauri binary by build.rs (cc crate);
      # MSVC is preinstalled on windows-latest, GCC on ubuntu-latest.
      - name: Build desktop app signed (updater artifacts included)
        if: steps.signing.outputs.present == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- ${{ matrix.targets }} --config src-tauri/tauri.updater.conf.json

      - name: Build desktop app unsigned (no signing secret yet)
        if: steps.signing.outputs.present != 'true'
        run: echo "No TAURI_SIGNING_PRIVATE_KEY secret — building unsigned; the auto-updater stays dormant until the secret is added." && npm run desktop:build -- ${{ matrix.targets }}

      # The dist the desktop bundles must also boot as a plain prod page —
      # the v15.0.0 black screen was a prod-only chunk-order TDZ that every
      # dev-mode gate missed.
      - name: Production web smoke (bundled dist must boot)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium && npm run prod:smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-universe-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  # Publishes the built installers as a GitHub Release when a v* tag is pushed.
  # Pull-request and plain-push runs stop after the build matrix above.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Collect built installers
        uses: actions/download-artifact@v4
        with:
          pattern: my-universe-*
          merge-multiple: true
          path: release-assets

      # upload-artifact@v4 preserves each build's directory structure, so the
      # installers land at varying depths — recurse instead of a flat glob.
      - name: List collected installers
        run: ls -R release-assets

      # latest.json is what every installed app polls to discover updates.
      # Signed builds ship .sig files; the generator folds them into the
      # manifest. Unsigned builds have none — it skips and the updater
      # simply stays dormant until the signing secret exists.
      - name: Generate updater manifest (latest.json)
        run: node scripts/make-latest-json.mjs release-assets "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MY UNIVERSE ${{ github.ref_name }}
          files: |
            release-assets/**/*.exe
            release-assets/**/*.exe.sig
            release-assets/**/*.deb
            release-assets/**/*.AppImage
            release-assets/**/*.AppImage.sig
            release-assets/latest.json
          generate_release_notes: true
          # unmatched patterns are expected on unsigned builds (no .sig /
          # latest.json); the "did installers even build" safety lives in
          # make-latest-json.mjs, which exits 1 when none are present.
          fail_on_unmatched_files: false
