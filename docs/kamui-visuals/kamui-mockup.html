<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAMUI — Vortex Activation Mockup (research visualization)</title>
<style>
  html, body { margin: 0; background: #050508; color: #cfd3e0; font-family: "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px 6px; letter-spacing: .18em; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; color: #e8e4da; }
  header p { margin: 4px 0 0; font-size: 11px; color: #7d8296; letter-spacing: .08em; }
  #stage { display: block; margin: 8px auto; border: 1px solid #1c1e2a; border-radius: 6px; background: #020204; max-width: 96vw; }
  #bar { position: relative; height: 3px; background: #14151f; margin: 0 auto; width: 960px; max-width: 96vw; }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #7a5cff, #ff7a3c, #fff); }
  #controls { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 0 22px; font-size: 12px; }
  button { background: #15172a; color: #dfe2ef; border: 1px solid #2b2e48; border-radius: 5px; padding: 6px 16px; cursor: pointer; letter-spacing: .1em; }
  button:hover { background: #1e2140; }
  label { color: #8f94ab; }
  #phase { color: #ffb469; letter-spacing: .22em; font-size: 11px; min-width: 240px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>KAMUI — VORTEX ACTIVATION MOCKUP</h1>
  <p>RESEARCH VISUALIZATION · SEE docs/KAMUI-VISUAL-STORYBOARD.md · NOT PART OF THE APP</p>
</header>
<canvas id="stage" width="960" height="540"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="controls">
  <button id="replay">REPLAY</button>
  <label><input type="checkbox" id="slow"> SLOW MOTION (0.25×)</label>
  <span id="phase"></span>
</div>
<script>
"use strict";
const cv = document.getElementById("stage"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2;
const DUR = 5.6; // seconds, one full pass

// ---------- phase table (mirrors the storyboard) ----------
const PHASES = [
  [0.0, 0.5,  "T0 · ACTIVATION PULSE"],
  [0.5, 1.2,  "T1 · REALITY BENDS FIRST"],
  [1.2, 2.2,  "T2 · THE WHIRLPOOL GRIPS"],
  [2.2, 3.4,  "T3 · FORM LOSS — STRUCTURE SHREDS"],
  [3.4, 4.2,  "T4 · FEEDING VORTEX"],
  [4.2, 4.7,  "T5 · THE TEAR"],
  [4.7, 5.6,  "T6 · PORTAL OPEN"],
];
const ease = (t) => t * t * (3 - 2 * t);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// progress 0..1 inside a time window
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

// ---------- static content ----------
const stars = [];
for (let i = 0; i < 340; i++) {
  const ang = Math.random() * Math.PI * 2;
  const r = 40 + Math.pow(Math.random(), 0.7) * 480;
  stars.push({ ang, r, s: 0.4 + Math.random() * 1.4, tw: Math.random() * Math.PI * 2, near: r < 300 });
}
const nebulae = [
  { x: -190, y: -120, r: 260, c: "rgba(124,58,237,", a: 0.16, w: 1.6 },
  { x: 210, y: 90, r: 300, c: "rgba(34,211,238,", a: 0.12, w: 2.1 },
  { x: 40, y: -220, r: 220, c: "rgba(236,72,153,", a: 0.10, w: 2.8 },
];
const bodies = [
  { name: "anchor", r0: 205, th0: 0.9,  size: 15, star: true },
  { name: "pA",     r0: 155, th0: 2.9,  size: 7,  star: false },
  { name: "pB",     r0: 185, th0: 4.6,  size: 6,  star: false },
  { name: "pC",     r0: 130, th0: 5.6,  size: 5,  star: false },
];

// ---------- helpers ----------
function polarToXY(r, ang) { return [CX + r * Math.cos(ang), CY + r * Math.sin(ang)]; }
// tangent smear: rotate a star's angle by swirl field α(r)
function swirlField(r, strength) {
  return strength * Math.exp(-r / 150) * 2.2; // radians of extra angle near center
}
function glowDot(x, y, rad, inner, outer, alpha) {
  const g = cx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, inner.replace("A)", alpha + ")"));
  g.addColorStop(1, outer.replace("A)", "0)"));
  cx.fillStyle = g;
  cx.beginPath();
  cx.arc(x, y, rad, 0, Math.PI * 2);
  cx.fill();
}

// ---------- render pass ----------
let trails = {}; // per-body trail history
function draw(t) {
  const act = win(t, 0, 0.5);          // activation pulse 0..1
  const bend = win(t, 0.5, 1.2);       // reality bends 0..1
  const grip = win(t, 1.2, 2.2);       // whirlpool forms 0..1
  const shred = win(t, 2.2, 3.4);      // form loss 0..1
  const feed = win(t, 3.4, 4.2);       // feeding 0..1
  const tear = win(t, 4.2, 4.7);       // tear 0..1
  const portal = win(t, 4.7, 5.6);     // portal 0..1
  const total = act * 0 + bend + grip + shred + feed; // rough vortex intensity
  const swirl = bend * 0.5 + grip * 1.0 + Math.min(1, shred + feed) * 1.2 - portal * 0.8;
  const pull = clamp(bend * 0.2 + grip * 0.45 + shred * 0.35 + feed * 0.5 - portal * 0.9, 0, 1);
  const spin = t * (0.25 + total * 0.9); // global differential rotation driver
  const dim = 1 - portal * 0.55 + tear * 0.3;
  const shake = tear > 0 && tear < 1 ? (1 - tear) * 6 : 0;

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#020204";
  cx.fillRect(0, 0, W, H);
  if (shake) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // nebulae: slowly swirl & stretch (the "universe surface")
  cx.save();
  cx.translate(CX, CY);
  cx.rotate(swirl * 0.22);
  for (const n of nebulae) {
    const sx = 1 + total * 0.5, sy = 1 - total * 0.18;
    cx.save();
    cx.translate(n.x, n.y);
    cx.rotate(n.w * 0.3 * total);
    cx.scale(sx, sy);
    glowDot(0, 0, n.r * (1 - pull * 0.25), n.c + "0.9)", n.c, n.a * dim);
    cx.restore();
  }
  cx.restore();

  // starfield: tangential smear + radial pull near the core
  for (const s of stars) {
    const a = s.ang + swirlField(s.r, swirl) + (s.near ? spin * 0.35 * Math.exp(-s.r / 220) : 0);
    const r = s.r * (1 - pull * 0.4 * Math.exp(-s.r / 190));
    const [x, y] = polarToXY(r, a);
    if (s.near && total > 0.25) { // smeared arcs
      cx.strokeStyle = `rgba(220,224,255,${0.5 * dim})`;
      cx.lineWidth = s.s * 0.9;
      cx.beginPath();
      cx.arc(CX, CY, r, a - 0.05 - total * 0.16, a + 0.05 + total * 0.16);
      cx.stroke();
    } else {
      const tw = 0.55 + 0.45 * Math.sin(t * 2 + s.tw);
      cx.fillStyle = `rgba(214,220,255,${0.75 * tw * dim})`;
      cx.beginPath();
      cx.arc(x, y, s.s, 0, Math.PI * 2);
      cx.fill();
    }
  }

  // spiral arms: log-spiral bead trails, differential rotation (inner faster)
  const armN = Math.floor(grip * 60 + shred * 50 + feed * 40);
  if (armN > 2) {
    for (let arm = 0; arm < 3; arm++) {
      for (let i = 0; i < armN; i++) {
        const f = i / armN;                       // 0 = inner, 1 = outer
        const r = 46 + 190 * Math.pow(f, 0.85);
        const ang = arm * 2 * Math.PI / 3
          - 1.6 * Math.log(r / 46)               // trailing log-spiral shape
          + spin * (55 / r) * 2.4;               // differential: inner laps outer
        const [x, y] = polarToXY(r, ang);
        const heat = 1 - f;
        const al = (0.16 + 0.5 * heat * heat) * (0.35 + 0.65 * grip) * dim * (1 - portal * 0.7);
        const rad = 1.2 + 2.6 * heat;
        cx.fillStyle = heat > 0.72
          ? `rgba(255,250,240,${al})`
          : heat > 0.35 ? `rgba(255,${140 + 80 * heat | 0},60,${al})`
          : `rgba(160,110,255,${al * 0.8})`;
        cx.beginPath();
        cx.arc(x, y, rad, 0, Math.PI * 2);
        cx.fill();
      }
    }
  }

  // cosmic bodies: spiral inward, stretch, then shred into streams
  for (const b of bodies) {
    const goneAt = b.star ? 3.1 : 3.7;           // time when structure is fully lost
    const dead = t > goneAt;
    const prog = clamp(t / goneAt, 0, 1);
    const r = b.r0 - (b.r0 - 62) * Math.pow(prog, 1.5);
    const th = b.th0 + 1.1 * prog * prog;
    if (dead) {                                   // stream of debris along the spiral
      const n = b.star ? 26 : 14;
      for (let i = 0; i < n; i++) {
        const f = i / n;
        const rr = 52 + (r - 52) * (1 - f);
        const aa = th + f * (b.star ? 2.1 : 1.2) + spin * (55 / rr) * 2.4;
        const [x, y] = polarToXY(rr, aa);
        const heat = 1 - f;
        glowDot(x, y, (b.star ? 9 : 5) * (1 - 0.5 * f) * (1 - portal * 0.5),
          "rgba(255,244,220,A)", "rgba(255,120,40,A)", 0.5 * dim * (1 - f * 0.6));
      }
      if (b.star) { // bright head of the stellar stream
        const [x, y] = polarToXY(r, th + spin * (55 / r) * 2.4);
        glowDot(x, y, 14 * (1 - portal * 0.5), "rgba(255,250,235,A)", "rgba(255,140,50,A)", 0.85 * dim);
      }
      continue;
    }
    const stretch = 1 + 2.4 * Math.max(0, prog - 0.35);   // tidal elongation
    const size = b.size * (1 - 0.45 * prog);
    const [x, y] = polarToXY(r, th);
    const angToCore = Math.atan2(CY - y, CX - x);
    cx.save();
    cx.translate(x, y);
    cx.rotate(angToCore);
    // tidal bulge → elongation toward the core
    cx.scale(stretch, Math.max(0.5, 1 - (stretch - 1) * 0.28));
    if (b.star) glowDot(0, 0, size * 2.6, "rgba(255,246,225,A)", "rgba(255,150,60,A)", 0.95 * dim);
    else glowDot(0, 0, size * 2.2, "rgba(190,205,235,A)", "rgba(60,70,110,A)", 0.9 * dim);
    cx.fillStyle = b.star ? `rgba(255,240,205,${0.95 * dim})` : `rgba(140,155,195,${0.95 * dim})`;
    cx.beginPath();
    cx.arc(0, 0, size * (1 - 0.2 * Math.max(0, stretch - 1) * 0.3), 0, Math.PI * 2);
    cx.fill();
    cx.restore();
  }

  // the core: black shadow + thin photon ring + heat glow + Doppler-bright side
  const coreGlow = 26 + total * 30 + tear * 40;
  glowDot(CX, CY, coreGlow * 2.4, "rgba(255,190,120,A)", "rgba(255,110,40,A)", (0.30 + 0.22 * total) * dim);
  const dop = cx.createRadialGradient(CX - coreGlow * 0.8, CY, 0, CX, CY, coreGlow * 2.2);
  dop.addColorStop(0, `rgba(210,230,255,${0.10 * dim})`);
  dop.addColorStop(1, "rgba(210,230,255,0)");
  cx.fillStyle = dop;
  cx.fillRect(0, 0, W, H);
  cx.fillStyle = "#000";
  cx.beginPath();
  cx.arc(CX, CY, 34, 0, Math.PI * 2);
  cx.fill();
  cx.strokeStyle = `rgba(255,235,205,${0.9 * dim})`;
  cx.lineWidth = 2.2;
  cx.beginPath();
  cx.arc(CX, CY, 37.5, 0, Math.PI * 2);
  cx.stroke();

  // activation pulse ring (T0)
  if (act < 1) {
    cx.strokeStyle = `rgba(255,220,180,${0.8 * (1 - act)})`;
    cx.lineWidth = 3 * (1 - act) + 0.5;
    cx.beginPath();
    cx.arc(CX, CY, 40 + act * 260, 0, Math.PI * 2);
    cx.stroke();
  }

  // the tear: white flash ring + radial burst
  if (tear > 0 && tear < 1) {
    const rr = 40 + ease(tear) * 300;
    cx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - tear)})`;
    cx.lineWidth = 5 * (1 - tear) + 1;
    cx.beginPath();
    cx.arc(CX, CY, rr, 0, Math.PI * 2);
    cx.stroke();
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * Math.PI * 2;
      const r1 = 44 + tear * 60, r2 = r1 + 40 * (1 - tear);
      cx.strokeStyle = `rgba(255,240,220,${0.5 * (1 - tear)})`;
      cx.lineWidth = 1.4;
      cx.beginPath();
      cx.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
      cx.lineTo(CX + Math.cos(a) * r2, CY + Math.sin(a) * r2);
      cx.stroke();
    }
  }
  // portal state: everything faded, slow residual swirl around the dark void
  if (portal > 0) {
    cx.strokeStyle = `rgba(150,120,255,${0.35 * (1 - portal * 0.5)})`;
    cx.lineWidth = 1.2;
    cx.beginPath();
    cx.arc(CX, CY, 60 + 10 * Math.sin(t * 3), 0, Math.PI * 2);
    cx.stroke();
  }
}

// ---------- loop ----------
let t0 = performance.now(), playing = true;
const phaseEl = document.getElementById("phase");
const fill = document.getElementById("fill");
function frame(now) {
  const slow = document.getElementById("slow").checked ? 0.25 : 1;
  let t = ((now - t0) / 1000) * slow % DUR;
  draw(t);
  fill.style.width = (t / DUR * 100) + "%";
  const ph = PHASES.find((p) => t >= p[0] && t < p[1]) || PHASES[PHASES.length - 1];
  phaseEl.textContent = ph[2];
  requestAnimationFrame(frame);
}
document.getElementById("replay").onclick = () => { t0 = performance.now(); };
requestAnimationFrame(frame);
</script>
</body>
</html>
