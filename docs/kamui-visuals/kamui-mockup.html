<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAMUI — Vortex Activation Mockup (research visualization)</title>
<style>
  html, body { margin: 0; background: #04040a; color: #cfd3e0; font-family: "Segoe UI", system-ui, sans-serif; }
  header { padding: 14px 20px 6px; letter-spacing: .18em; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; color: #e8e4da; }
  header p { margin: 4px 0 0; font-size: 11px; color: #7d8296; letter-spacing: .08em; }
  #stage { display: block; margin: 8px auto; border: 1px solid #1c1e2a; border-radius: 6px; background: #020204; max-width: 96vw; }
  #bar { position: relative; height: 3px; background: #14151f; margin: 0 auto; width: 960px; max-width: 96vw; }
  #fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #7a5cff, #ff7a3c, #fff); }
  #controls { display: flex; gap: 14px; align-items: center; justify-content: center; padding: 10px 0 22px; font-size: 12px; }
  button { background: #15172a; color: #dfe2ef; border: 1px solid #2b2e48; border-radius: 5px; padding: 6px 16px; cursor: pointer; letter-spacing: .1em; }
  button:hover { background: #1e2140; }
  label { color: #8f94ab; }
  #phase { color: #ffb469; letter-spacing: .22em; font-size: 11px; min-width: 240px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>KAMUI — VORTEX ACTIVATION MOCKUP</h1>
  <p>RESEARCH VISUALIZATION · FULL-FRAME LIQUID VORTEX (ref: dark ocean-vortex + cyan/magenta nebula vortex) · NOT PART OF THE APP</p>
</header>
<canvas id="stage" width="960" height="540"></canvas>
<div id="bar"><div id="fill"></div></div>
<div id="controls">
  <button id="replay">REPLAY</button>
  <label><input type="checkbox" id="slow"> SLOW MOTION (0.25×)</label>
  <span id="phase"></span>
</div>
<script>
"use strict";
const cv = document.getElementById("stage"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height, CX = W / 2, CY = H / 2;
const DUR = 5.6; // seconds, one full pass

// ---------- phase table (mirrors the storyboard) ----------
const PHASES = [
  [0.0, 0.5,  "T0 · ACTIVATION PULSE"],
  [0.5, 1.2,  "T1 · REALITY BENDS FIRST"],
  [1.2, 2.2,  "T2 · THE WHIRLPOOL GRIPS"],
  [2.2, 3.4,  "T3 · FORM LOSS — STRUCTURE SHREDS"],
  [3.4, 4.2,  "T4 · FEEDING VORTEX"],
  [4.2, 4.7,  "T5 · THE TEAR"],
  [4.7, 5.6,  "T6 · PORTAL OPEN"],
];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const win = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const R_MAX = 660; // flow reaches past the canvas corners (551px)

// ---------- full-frame flow field (the "universe surface" as liquid) ----------
const FLOW_N = 1150;
const flow = [];
for (let i = 0; i < FLOW_N; i++) {
  const fam = Math.random(); // 0–0.45 cyan · 0.45–0.8 magenta · 0.8–1 white-blue
  flow.push({
    r: 46 + Math.sqrt(Math.random()) * (R_MAX - 46),
    th: Math.random() * Math.PI * 2,
    fam,
    s: 0.5 + Math.random() * 1.1,
    ph: Math.random() * Math.PI * 2,
    dep: 0.35 + Math.random() * 0.65,
  });
}
// static star specks beneath the flow (matches the reference stills)
const specks = [];
for (let i = 0; i < 150; i++) {
  specks.push({ x: Math.random() * W, y: Math.random() * H, s: 0.3 + Math.random() * 1.1, tw: Math.random() * 6.28 });
}
// soft nebula sheets caught in the flow
const nebulae = [
  { r0: 300, th0: 0.6, rad: 250, c: "255,60,200", a: 0.14 },
  { r0: 380, th0: 3.1, rad: 300, c: "60,220,255", a: 0.12 },
  { r0: 340, th0: 4.9, rad: 210, c: "120,80,255", a: 0.11 },
];
const bodies = [
  { name: "anchor", r0: 250, th0: 0.9,  size: 15, star: true },
  { name: "pA",     r0: 185, th0: 2.9,  size: 7,  star: false },
  { name: "pB",     r0: 300, th0: 4.6,  size: 6,  star: false },
  { name: "pC",     r0: 160, th0: 5.6,  size: 5,  star: false },
];

// ---------- flow math ----------
function omega(r, spin) { return spin * (175 / (r + 60)); }        // rad/s, differential
function infall(r, k) { return k * (95 / (r + 75)); }             // px/s inward drift
function flowAdvance(r, th, dt, spin, k) {                         // dt may be negative
  return [r - infall(r, k) * dt, th + omega(r, spin) * dt];
}
function heatAt(r) { return Math.pow(clamp(1 - r / 640, 0, 1), 1.35); }
function famColor(fam, heat) {
  if (heat > 0.78) return "255,232,196";                       // white-gold inner filaments
  if (fam < 0.45) return "96,222,255";                          // cyan
  if (fam < 0.8) return "255,72,205";                           // magenta
  return "140,150,255";                                         // blue-white
}
function glowDot(x, y, rad, rgb, alpha) {
  if (rad <= 0 || alpha <= 0) return;
  const g = cx.createRadialGradient(x, y, 0, x, y, rad);
  g.addColorStop(0, `rgba(${rgb},${alpha})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  cx.fillStyle = g;
  cx.beginPath();
  cx.arc(x, y, rad, 0, Math.PI * 2);
  cx.fill();
}

// ---------- render pass ----------
function draw(t, time) {
  const act = win(t, 0, 0.5);
  const bend = win(t, 0.5, 1.2);
  const grip = win(t, 1.2, 2.2);
  const shred = win(t, 2.2, 3.4);
  const feed = win(t, 3.4, 4.2);
  const tear = win(t, 4.2, 4.7);
  const portal = win(t, 4.7, 5.6);
  const intensity = clamp(bend * 0.3 + grip * 0.5 + shred * 0.7 + feed, 0, 1);
  const spin = (0.1 + 0.9 * bend) * (1 - 0.75 * Math.sin(Math.PI * tear)) * (1 - portal * 0.85);
  const k = 0.05 * bend + 0.3 * grip + 0.65 * shred + 1.0 * feed - 0.9 * portal; // inward drift
  const dim = 1 - portal * 0.55 + tear * 0.25;
  const shake = tear > 0 && tear < 1 ? (1 - tear) * 7 : 0;

  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.fillStyle = "#04040a";
  cx.fillRect(0, 0, W, H);
  if (shake) cx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // static star specks
  for (const s of specks) {
    const tw = 0.5 + 0.5 * Math.sin(time * 1.6 + s.tw);
    cx.fillStyle = `rgba(215,222,255,${0.4 * tw * dim})`;
    cx.fillRect(s.x, s.y, s.s, s.s);
  }

  cx.globalCompositeOperation = "lighter";

  // nebula sheets: broad soft color bands advected around the eye
  for (const n of nebulae) {
    const th = n.th0 + omega(n.r0, spin || 0.0001) * t * 0.9;
    const x = CX + n.r0 * Math.cos(th), y = CY + n.r0 * Math.sin(th);
    const stretch = 1 + intensity * 1.7;
    cx.save();
    cx.translate(x, y);
    cx.rotate(th + Math.PI / 2);
    cx.scale(stretch, Math.max(0.5, 1 - intensity * 0.3));
    glowDot(0, 0, n.rad, n.c, n.a * dim * (0.5 + 0.5 * intensity));
    cx.restore();
  }

  // the liquid vortex: every particle is a curved streak advected by the flow field
  const dtBack1 = 0.055, dtBack2 = 0.14;
  for (const p of flow) {
    const wisp = 7 * Math.sin(time * 0.6 + p.ph);
    const r = Math.max(30, p.r + wisp);
    const [x0, y0] = polar(r, p.th);
    const [rb1, tb1] = flowAdvance(r, p.th, -dtBack1, spin, k);
    const [rb2, tb2] = flowAdvance(r, p.th, -dtBack2, spin, k);
    const heat = heatAt(r);
    const dop = 1 + 0.3 * Math.cos(p.th - 2.6) * (0.4 + 0.6 * feed); // Doppler-bright side
    const alpha = clamp(p.dep * (0.13 + 0.6 * heat) * dop * dim * (1 - portal * 0.6), 0, 0.85);
    const rgb = famColor(p.fam, heat);
    const lw = p.s * (0.9 + 2.4 * heat);
    cx.strokeStyle = `rgba(${rgb},${alpha})`;
    cx.lineWidth = lw;
    cx.lineCap = "round";
    cx.beginPath();
    const [x1, y1] = polar(rb1, tb1), [x2, y2] = polar(rb2, tb2);
    cx.moveTo(x2, y2);
    cx.lineTo(x1, y1);
    cx.lineTo(x0, y0);
    cx.stroke();
    // respawn at the rim when consumed
    if (p.r < 42) {
      p.r = R_MAX * (0.86 + Math.random() * 0.14);
      p.th = Math.random() * Math.PI * 2;
    } else {
      flowAdvanceInto(p, 0.016, spin, k);
    }
  }

  // cosmic bodies ride the flow: spiral in, stretch, shred into streams
  for (const b of bodies) {
    const goneAt = b.star ? 3.1 : 3.7;
    const dead = t > goneAt;
    const prog = clamp(t / goneAt, 0, 1);
    const r = b.r0 - (b.r0 - 66) * Math.pow(prog, 1.5);
    const th = b.th0 + 1.15 * prog * prog + omega(b.r0, spin) * t * 0.55;
    if (dead) {
      const n = b.star ? 26 : 14;
      for (let i = 0; i < n; i++) {
        const f = i / n;
        const rr = 56 + (r - 56) * (1 - f);
        const aa = th + f * (b.star ? 2.2 : 1.25);
        const [x, y] = polar(rr, aa);
        glowDot(x, y, (b.star ? 10 : 5.5) * (1 - 0.5 * f) * (1 - portal * 0.5),
          "255,244,220", 0.5 * dim * (1 - f * 0.6));
      }
      if (b.star) {
        const [x, y] = polar(r, th);
        glowDot(x, y, 15 * (1 - portal * 0.5), "255,250,235", 0.85 * dim);
      }
      continue;
    }
    const stretch = 1 + 2.5 * Math.max(0, prog - 0.32);
    const size = b.size * (1 - 0.45 * prog);
    const [x, y] = polar(r, th);
    const angToCore = Math.atan2(CY - y, CX - x);
    cx.save();
    cx.translate(x, y);
    cx.rotate(angToCore);
    cx.scale(stretch, Math.max(0.5, 1 - (stretch - 1) * 0.28));
    if (b.star) glowDot(0, 0, size * 2.6, "255,246,225", 0.95 * dim);
    else glowDot(0, 0, size * 2.2, "190,205,235", 0.9 * dim);
    cx.fillStyle = b.star ? `rgba(255,240,205,${0.95 * dim})` : `rgba(140,155,195,${0.95 * dim})`;
    cx.beginPath();
    cx.arc(0, 0, size * (1 - 0.2 * Math.max(0, stretch - 1) * 0.3), 0, Math.PI * 2);
    cx.fill();
    cx.restore();
  }

  // the eye: dark void that GROWS as it feeds + thin bright ring + bright seed at center
  const coreR = 34 + 72 * intensity;
  glowDot(CX, CY, coreR * 2.1, "255,180,110", (0.16 + 0.3 * intensity) * dim);
  const dop = cx.createRadialGradient(CX - coreR, CY, 0, CX, CY, coreR * 2.4);
  dop.addColorStop(0, `rgba(120,220,255,${0.08 * dim})`);
  dop.addColorStop(1, "rgba(120,220,255,0)");
  cx.fillStyle = dop;
  cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = "source-over";
  cx.fillStyle = "#000";
  cx.beginPath();
  cx.arc(CX, CY, coreR, 0, Math.PI * 2);
  cx.fill();
  cx.strokeStyle = `rgba(255,225,185,${0.85 * dim})`;
  cx.lineWidth = 1.8;
  cx.beginPath();
  cx.arc(CX, CY, coreR + 2.5, 0, Math.PI * 2);
  cx.stroke();
  glowDot(CX, CY, 10 + 14 * intensity, "255,214,150", 0.9 * dim); // the seed (image 1's tiny star)
  cx.globalCompositeOperation = "lighter";

  // activation pulse ring (T0)
  if (act < 1) {
    cx.strokeStyle = `rgba(255,220,180,${0.8 * (1 - act)})`;
    cx.lineWidth = 3 * (1 - act) + 0.5;
    cx.beginPath();
    cx.arc(CX, CY, coreR + act * 320, 0, Math.PI * 2);
    cx.stroke();
  }

  // the tear: white flash ring + radial burst
  if (tear > 0 && tear < 1) {
    const rr = coreR + 6 + win(t, 4.2, 4.7) ** 0.7 * 340;
    cx.strokeStyle = `rgba(255,255,255,${0.9 * (1 - tear)})`;
    cx.lineWidth = 5 * (1 - tear) + 1;
    cx.beginPath();
    cx.arc(CX, CY, rr, 0, Math.PI * 2);
    cx.stroke();
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * Math.PI * 2;
      const r1 = coreR + 8 + tear * 60, r2 = r1 + 44 * (1 - tear);
      cx.strokeStyle = `rgba(255,240,220,${0.5 * (1 - tear)})`;
      cx.lineWidth = 1.4;
      cx.beginPath();
      cx.moveTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
      cx.lineTo(CX + Math.cos(a) * r2, CY + Math.sin(a) * r2);
      cx.stroke();
    }
  }
  // portal state: calm slow swirl around the open void
  if (portal > 0) {
    cx.strokeStyle = `rgba(150,120,255,${0.3 * (1 - portal * 0.5)})`;
    cx.lineWidth = 1.2;
    cx.beginPath();
    cx.arc(CX, CY, coreR + 26 + 8 * Math.sin(time * 2.4), 0, Math.PI * 2);
    cx.stroke();
  }
  cx.globalCompositeOperation = "source-over";
}

function polar(r, th) { return [CX + r * Math.cos(th), CY + r * Math.sin(th)]; }
function flowAdvanceInto(p, dt, spin, k) {
  const [nr, nth] = flowAdvance(p.r, p.th, dt, spin, k);
  p.r = nr; p.th = nth;
}

// ---------- loop ----------
let t0 = performance.now();
const phaseEl = document.getElementById("phase");
const fill = document.getElementById("fill");
function frame(now) {
  const slow = document.getElementById("slow").checked ? 0.25 : 1;
  const time = now / 1000;
  const t = ((now - t0) / 1000) * slow % DUR;
  draw(t, time);
  fill.style.width = (t / DUR * 100) + "%";
  const ph = PHASES.find((p) => t >= p[0] && t < p[1]) || PHASES[PHASES.length - 1];
  phaseEl.textContent = ph[2];
  requestAnimationFrame(frame);
}
document.getElementById("replay").onclick = () => { t0 = performance.now(); };
requestAnimationFrame(frame);
</script>
</body>
</html>
