[package]
name = "my-universe"
# App version drives the installer filename AND the updater check — keep it
# aligned with the git tag (v15.0.2 → 15.0.2) on every release.
version = "15.0.9"
description = "MY UNIVERSE — a living 3D cosmos, diary and vault (desktop shell)"
authors = ["Chasin-Love"]
edition = "2021"

[lib]
name = "my_universe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles src/platform/native/cosmos_engine.cpp directly into the binary — the C++
# core ships inside the app with no DLL loading step at all.
cc = "1"

[dependencies]
# devtools in RELEASE builds too: the installed app must always be inspectable
# (right-click → Inspect) — an un-debuggable black screen cost us v15.0.0.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
